<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>터미널 시험</title>
  <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css">
  <script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="node_modules/@xterm/addon-unicode11/lib/addon-unicode11.js"></script>
</head>
<body style="margin:0;background:#1e1e1e">
  <div id="t" style="width:100vw;height:100vh"></div>
  <script>
    const term = new Terminal({ allowProposedApi: true, fontFamily: 'D2Coding, Consolas, monospace', fontSize: 14 });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.loadAddon(new Unicode11Addon.Unicode11Addon());
    term.unicode.activeVersion = '11';
    term.open(document.getElementById('t'));
    fit.fit();
    window.pty.resize(term.cols, term.rows);
    window.pty.onData(d => term.write(d));
    term.onData(d => window.pty.input(d));
    window.addEventListener('resize', () => { fit.fit(); window.pty.resize(term.cols, term.rows); });

    // 시험 모드: 화면 버퍼를 글자로 읽고, '가나다ABC' 줄에서 'A' 가 놓인 칸 위치로 한글 폭을 확인한다
    window.pty.onReportRequest(() => {
      const buf = term.buffer.active, lines = [];
      let width = '';
      for (let y = 0; y < buf.length; y++) {
        const line = buf.getLine(y);
        const text = line.translateToString(true);
        if (text.trim()) lines.push(text);
        if (text.startsWith('가나다ABC')) {
          for (let x = 0; x < line.length; x++) if (line.getCell(x).getChars() === 'A') { width = `한글 3글자 뒤 A 위치 칸=${x} (기대값 6)`; break; }
        }
      }
      window.pty.report(`unicode=${term.unicode.activeVersion} ${width}\n` + lines.join('\n'));
    });
  </script>
</body>
</html>
